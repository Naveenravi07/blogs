- name: "Nova"
  desc: |
    Nova is an edtech platform built using Next.js, Express.js, Redis, and MongoDB.
    • Designed and implemented a fully automated video transcoding and streaming infrastructure leveraging FFmpeg, S3,
      CloudFront, EC2, and Lambda, significantly reducing costs compared to AWS MediaConvert.
